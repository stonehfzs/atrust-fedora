name: Source and safety checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s tests -v
      - run: python3 -m py_compile scripts/*.py
      - run: bash -n packaging/atrust packaging/atrust-fedora-daemon packaging/atrust-fedora-initialize packaging/atrust-fedora-backup
